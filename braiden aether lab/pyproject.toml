[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aetherlab"
version = "1.0.0"
description = "Braiden's Aether Lab - free phone service toolbox"
requires-python = ">=3.10"
dependencies = ["pyusb>=1.2.1", "pyserial>=3.5"]

[project.scripts]
aether = "aetherlab.cli:main"

[tool.setuptools.packages.find]
include = ["aetherlab*"]
